<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Motion Studio: visually design motion.dev animations and export ready-to-paste JavaScript, React or HTML."
    />
    <title>Motion Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 22 L13 10 L17 18 L20 12 L23 22' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Umami analytics (motion.farhan.app) -->
    <script defer src="https://mochi.farhan.app/script.js" data-website-id="8d596468-94e5-45f4-879c-698006fc90dc"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Motion Studio</span>
          <span class="brand-sub">for motion.dev</span>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost" id="btn-theme" title="Toggle light / dark theme" aria-label="Toggle theme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <button class="btn ghost" id="btn-reset" title="Start from a blank animation">Reset</button>
          <button class="btn ghost" id="btn-share" title="Copy a link to this exact animation">Share link</button>
          <button class="btn primary" id="btn-export">Export code</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel presets" id="presets-panel" aria-label="Presets">
          <div class="panel-head">
            <h2>Presets</h2>
            <p class="hint">Start from one, then tweak.</p>
          </div>
          <div class="preset-list" id="preset-list"></div>
        </aside>

        <section class="stage-wrap" aria-label="Preview">
          <div class="stage-toolbar">
            <div class="stage-status" id="stage-status"></div>
            <div class="stage-controls">
              <label class="toggle small" title="Replay automatically whenever you change a value">
                <input type="checkbox" id="auto-replay" checked />
                <span>Auto-replay</span>
              </label>
              <button class="btn" id="btn-replay">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                Replay
              </button>
            </div>
          </div>
          <div class="stage" id="stage"></div>
        </section>

        <aside class="panel inspector" id="inspector" aria-label="Inspector">
          <nav class="tabs" role="tablist">
            <button class="tab active" data-tab="design" role="tab">Design</button>
            <button class="tab" data-tab="code" role="tab">Code</button>
          </nav>
          <div class="tab-panel" id="tab-design"></div>
          <div class="tab-panel hidden" id="tab-code"></div>
        </aside>
      </main>

      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button data-view="presets">Presets</button>
        <button data-view="stage" class="active">Preview</button>
        <button data-view="design">Design</button>
        <button data-view="code">Code</button>
      </nav>
    </div>

    <div class="modal-backdrop hidden" id="export-modal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="export-title">
        <div class="modal-head">
          <h2 id="export-title">Export</h2>
          <button class="btn ghost icon" id="btn-close-export" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="export-body"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
